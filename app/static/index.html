<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ssorry Camera</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  header { padding: 8px 16px; display: flex; gap: 16px; }
  #view { position: relative; max-width: 100%; width: fit-content; margin: 0 auto; }
  #frame { display: block; max-width: 100%; background: #000; min-width: 320px; min-height: 240px; }
  #down { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
          justify-content: center; gap: 8px; background: rgba(0, 0, 0, 0.8); text-align: center; padding: 16px; }
  #down.show { display: flex; }
  #down strong { font-size: 18px; color: #f88; }
  #down small { color: #aaa; }
</style>
</head>
<body>
<header>
  <span id="status">연결 중...</span>
  <span id="fps"></span>
  <span id="info"></span>
  <span id="cams"></span>
</header>
<div id="view">
  <img id="frame" alt="camera">
  <div id="down"><strong>카메라를 불러오지 못했습니다</strong><small id="reason"></small></div>
</div>
<script>
const img = document.getElementById("frame");
const statusEl = document.getElementById("status");
const fpsEl = document.getElementById("fps");
const infoEl = document.getElementById("info");
let count = 0;
let currentUrl = null;

setInterval(() => { fpsEl.textContent = `${count} fps`; count = 0; }, 1000);

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const cam = new URLSearchParams(location.search).get("cam") || "";
  const ws = new WebSocket(`${proto}://${location.host}/ws/camera${cam ? `?cam=${encodeURIComponent(cam)}` : ""}`);
  ws.binaryType = "blob";

  ws.onopen = () => { statusEl.textContent = "연결됨"; };
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      const msg = JSON.parse(ev.data);
      if (msg.type === "camera_status") {
        // 다운이면 마지막 화면 위에 덮고, 복구되면 걷는다
        document.getElementById("down").classList.toggle("show", !msg.live);
        document.getElementById("reason").textContent = msg.live ? "" : msg.reason || "";
        return;
      }
      if (msg.type === "hello") {
        infoEl.textContent = `카메라 ${msg.cam}`;
        document.getElementById("cams").innerHTML = msg.cams
          .map((c) => `<a href="?cam=${encodeURIComponent(c)}" style="color:#8af">${c}</a>`).join(" ");
      }
      return;
    }
    const url = URL.createObjectURL(ev.data);
    img.onload = () => { if (currentUrl) URL.revokeObjectURL(currentUrl); currentUrl = url; };
    img.src = url;
    count++;
  };
  ws.onclose = (ev) => {
    statusEl.textContent = `끊김 (${ev.code}), 재연결 중...`;
    // 세션이 없으면(4401) 페이지를 새로 받아 쿠키를 발급받는다.
    if (ev.code === 4401) { location.reload(); return; }
    setTimeout(connect, 1000);
  };
}
connect();
</script>
</body>
</html>
