services:
  api:
    build: .
    container_name: ssorry-api
    ports:
      - "8000:8000"
    volumes:
      # 소스를 마운트해서 --reload 로 즉시 반영
      - ./app:/workspace/app
      # 프론트 빌드 결과(index.html 이 있는 폴더). 비어 있으면 내장 카메라 뷰어가 뜬다.
      - ${FRONTEND_DIST:-./frontend-dist}:/workspace/frontend:ro
    environment:
      # 셸 환경변수나 .env 로 덮어쓴다. 예: MOCK=1 docker compose up -d
      MOCK: ${MOCK:-0}
      CAMERAS: ${CAMERAS:-top,wrist}
      CAMERA_SOURCE: ${CAMERA_SOURCE:-ingest}
      PIPER_URL: ${PIPER_URL:-http://host.docker.internal}
      PIPER_CAMERAS: ${PIPER_CAMERAS:-}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    extra_hosts:
      # 리눅스에서도 host.docker.internal 로 호스트(PIPER Studio)에 붙을 수 있게
      - "host.docker.internal:host-gateway"
